name: Build kexts

# Builds PhxBringup.kext (OpenCore EFI/OC/Kexts) and PhxAccel.kext (Auxiliary KC) on a GitHub macOS runner, so no Mac
# is needed to get them. Download them from the run's "kexts" artifact (Actions tab -> the run -> Artifacts).
on:
  push:
    branches: [ "main" ]
    paths: [ "src/**", "tools/phxctl/**", ".github/workflows/build-kexts.yml" ]
  workflow_dispatch:

jobs:
  kexts:
    runs-on: macos-15-intel   # macos-14 jobs were cancelled at creation (2026-11-01)
    steps:
    - uses: actions/checkout@v4

    - name: MacKernelSDK (pinned)
      run: |
        git clone https://github.com/acidanthera/MacKernelSDK "$RUNNER_TEMP/MacKernelSDK"
        git -C "$RUNNER_TEMP/MacKernelSDK" checkout 3f750085caa17ec3a7880f11c11bf4f48cd6a164

    - name: Build PhxBringup.kext
      run: sh src/phxbringup/build.sh "$RUNNER_TEMP/MacKernelSDK"

    - name: Build PhxAccel.kext
      run: sh src/phxaccel/build.sh "$RUNNER_TEMP/MacKernelSDK"

    - name: Build the bring-up tools (phxctl, mesboot, phxfw)
      working-directory: tools/phxctl
      run: |
        clang -arch x86_64 -O2 -o phxctl phxctl.c -framework IOKit -framework CoreFoundation
        clang -arch x86_64 -O2 -o mesboot mesboot.c -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -o phxfw phxfw.cpp \
          ../../src/amd/rdna3_ip_discovery.cpp ../../src/amd/rdna3_chip_profile.cpp \
          ../../src/amd/rdna3_ucode_extract.cpp ../../src/amd/rdna3_fw_plan.cpp -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -o dmcubload dmcubload.cpp \
          -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -I../../src/phxaccel/accel \
          -o modecheck modecheck.cpp -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -o clkinfo clkinfo.cpp \
          -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -o testl testl.cpp \
          -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -o testl2 testl2.cpp \
          -framework IOKit -framework CoreFoundation
        clang++ -arch x86_64 -std=c++17 -O2 -Wall -Wextra -Werror -I../../src/amd -o testl3 testl3.cpp \
          -framework IOKit -framework CoreFoundation

    - name: Check the binaries
      run: |
        for k in src/phxbringup/build/PhxBringup.kext src/phxaccel/build/PhxAccel.kext; do
          b="$k/Contents/MacOS/$(basename "$k" .kext)"
          file "$b"
          file "$b" | grep -q 'x86_64' || { echo "::error::$b is not an x86_64 binary"; exit 1; }
          plutil -lint "$k/Contents/Info.plist"
        done
        echo "PhxBringup build: $(grep -o 'PHX_KEXT_BUILD [0-9]*' src/phxbringup/PhxBringup.cpp)"
        for t in phxctl mesboot phxfw dmcubload modecheck clkinfo testl testl2 testl3; do file tools/phxctl/$t; done

    - name: Package
      run: |
        mkdir -p out
        ditto src/phxbringup/build/PhxBringup.kext out/PhxBringup.kext
        ditto src/phxaccel/build/PhxAccel.kext out/PhxAccel.kext
        mkdir -p out/phxctl && cp tools/phxctl/phxctl tools/phxctl/mesboot tools/phxctl/phxfw tools/phxctl/dmcubload tools/phxctl/modecheck tools/phxctl/clkinfo tools/phxctl/testl tools/phxctl/testl2 tools/phxctl/testl3 out/phxctl/
        echo "commit ${GITHUB_SHA}" > out/BUILD.txt

    - uses: actions/upload-artifact@v4
      with:
        name: kexts
        path: out/
        retention-days: 30
