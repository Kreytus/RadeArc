name: Build Mesa RADV

# Builds libvulkan_radeon.dylib (Mesa RADV with the Darwin backend) for x86_64 macOS from the pinned Mesa commit,
# Cobalt64's Darwin patches and mesa-patches-phoenix, so no Mac is needed. Then checks it without a GPU: the in-process
# mock kext pretends to be each chip (RADV_DARWIN_MOCK_GC = its GC IP version) and vkprobe must see the right device
# and compile a compute pipeline with ACO. Download the dylib from the run's "mesa-radv" artifact.
on:
  push:
    branches: [ "main" ]
    paths: [ "mesa-patches-phoenix/**", "tools/vkprobe/**", "tools/phxctl/testd.sh", ".github/workflows/build-mesa.yml" ]
  workflow_dispatch:

env:
  MESA_COMMIT: f5cb8ee032adabef599ae892ec4e42d796b84da9   # mesa-patches-phoenix/README.txt
  COBALT64_COMMIT: d1f7bad8408a0a2c016b067c477422975a59de44

jobs:
  radv:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4

    - name: Tools
      run: |
        brew install ninja glslang vulkan-loader vulkan-headers
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install -q meson mako pyyaml packaging
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

    - name: Mesa source + patches
      run: |
        git init -q "$RUNNER_TEMP/mesa" && cd "$RUNNER_TEMP/mesa"
        git config user.email ci@localhost && git config user.name ci
        git fetch -q --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_COMMIT" ||
          git fetch -q --depth 1 https://github.com/chaotic-cx/mesa-mirror "$MESA_COMMIT"
        git checkout -q FETCH_HEAD
        git clone -q https://github.com/Almosst-DEV/Cobalt64 "$RUNNER_TEMP/Cobalt64"
        git -C "$RUNNER_TEMP/Cobalt64" checkout -q "$COBALT64_COMMIT"
        git am -q "$RUNNER_TEMP"/Cobalt64/mesa-patches/*.patch
        git am -q "$GITHUB_WORKSPACE"/mesa-patches-phoenix/*.patch
        git log --oneline -17

    - name: Build RADV
      working-directory: ${{ runner.temp }}/mesa
      run: |
        meson setup build --buildtype=release -Dvulkan-drivers=amd -Dgallium-drivers= -Dplatforms= \
          -Dllvm=disabled -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false -Dgles1=disabled \
          -Dgles2=disabled -Dxmlconfig=disabled -Dvalgrind=disabled -Dlibunwind=disabled -Dzstd=disabled \
          -Dbuild-tests=false -Dvulkan-layers= -Dtools=
        ninja -C build
        file build/src/amd/vulkan/libvulkan_radeon.dylib

    - name: vkprobe
      working-directory: tools/vkprobe
      run: |
        glslangValidator -V --vn fill_spv fill.comp -o fill_spv.h
        clang -O2 -o vkprobe vkprobe.c -I"$(brew --prefix vulkan-headers)/include" \
          -L"$(brew --prefix vulkan-loader)/lib" -lvulkan -Wl,-rpath,"$(brew --prefix vulkan-loader)/lib"

    - name: Mock check (no GPU)
      run: |
        ls "$RUNNER_TEMP"/mesa/build/src/amd/vulkan/*.json
        M=$(ls "$RUNNER_TEMP"/mesa/build/src/amd/vulkan/radeon_devenv_icd*.json | head -1)
        cat "$M"
        probe() { # $1 = GC version the mock reports, $2 = the device line vkprobe must print
          rc=0
          out=$(VK_ICD_FILENAMES="$M" VK_LOADER_DEBUG=error RADV_DARWIN_MOCK=1 RADV_DARWIN_MOCK_GC=$1 \
                tools/vkprobe/vkprobe 2>&1) || rc=$?
          echo "$out"
          # the mock runs no command buffers (vkQueueSubmit fails, as upstream's README expects): the check ends at the
          # pipeline; the dispatch is Test D on the real GPU
          echo "vkprobe exit $rc"
          echo "$out" | grep -qF "$2" || { echo "::error::GC $1: expected '$2'"; exit 1; }
          echo "$out" | grep -q "compute pipeline compiled" || { echo "::error::GC $1: no pipeline"; exit 1; }
        }
        echo "== Phoenix 1 (GC 11.0.1)"
        probe 0xb0001 "AMD Radeon 780M Graphics (RADV PHOENIX)  vendor 0x1002 device 0x1900"
        # the runner's CPU brand string names no Radeon, so Phoenix 2 gets Linux's name for 1002:15C8
        echo "== Phoenix 2 (GC 11.0.4)"
        probe 0xb0004 "AMD Radeon Graphics (RADV PHOENIX2)  vendor 0x1002 device 0x15c8"

    - name: Package
      run: |
        # one folder that runs on the 8500G without Homebrew: RADV, the Vulkan loader next to vkprobe, an ICD manifest
        mkdir -p out
        cp "$RUNNER_TEMP/mesa/build/src/amd/vulkan/libvulkan_radeon.dylib" out/
        cp -L "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" out/
        cp tools/vkprobe/vkprobe tools/phxctl/testd.sh out/
        old=$(otool -L out/vkprobe | awk '/libvulkan/ {print $1}')
        install_name_tool -change "$old" @executable_path/libvulkan.1.dylib out/vkprobe
        install_name_tool -id @rpath/libvulkan.1.dylib out/libvulkan.1.dylib
        printf '{\n  "file_format_version": "1.0.1",\n  "ICD": { "library_path": "./libvulkan_radeon.dylib", "api_version": "1.4.0" }\n}\n' \
          > out/radeon_icd.json
        for f in out/libvulkan_radeon.dylib out/libvulkan.1.dylib out/vkprobe; do
          echo "== $f"; otool -L "$f"
          # nothing from Homebrew may be needed at run time
          if otool -L "$f" | tail -n +2 | grep -E '/usr/local/|/opt/homebrew/'; then echo "::error::$f needs Homebrew"; exit 1; fi
        done
        echo "mesa $MESA_COMMIT + Cobalt64 $COBALT64_COMMIT + RadeArc ${GITHUB_SHA}" > out/BUILD.txt

    - uses: actions/upload-artifact@v4
      with:
        name: mesa-radv
        path: out/
        retention-days: 30
