name: Build install package

# One folder for install.sh on the 8500G, without a Mac: upstream nullarc's release package (NullMoth's Metal plugin
# NVMTLDriver.bundle, which this repository does not build) with every Phoenix-2-aware piece from this repository put in:
# PhxBringup.kext and PhxAccel.kext and phxctl/mesboot/phxfw (latest green "Build kexts"), Mesa RADV (latest green
# "Build Mesa RADV"), the boot scripts and install.sh from this commit, and the gc_11_0_4/psp_13_0_11 firmware.
# Download it from the run's "radearc-package" artifact.
on:
  workflow_dispatch:
  # after a kext or Mesa build on main, so the package always carries the newest ones
  workflow_run:
    workflows: [ "Build kexts", "Build Mesa RADV" ]
    types: [ completed ]
    branches: [ main ]
  push:
    branches: [ "main" ]
    paths: [ "install/**", "tools/phxctl/*.sh", "hardware/dumps/b650m_8500g/vbios.rom", "tools/phxctl/local.phxboot.plist", ".github/workflows/build-package.yml" ]

jobs:
  package:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Packaging only copies, ad-hoc signs and zips (ditto, codesign, plutil): any Mac will do. The Intel images queued
    # for 15 minutes and were cancelled (2026-11-04); the kexts still build on macos-15-intel (build-kexts.yml).
    runs-on: macos-15
    permissions:
      contents: write   # the rolling "package-latest" release update.sh downloads from
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # A push that also changes the kexts or Mesa starts this run before their builds finish, so it would package the
    # previous ones (2026-11-01: build 39 shipped as "the new package"). Those pushes are packaged by workflow_run.
    - name: Skip a push whose kexts/Mesa are still building
      id: gate
      run: |
        skip=0
        if [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null &&
           git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(src/|mesa-patches-phoenix/|tools/phxctl/.*\.(c|cpp)$|tools/vkprobe/)'; then
          skip=1; echo "::notice::kexts/Mesa change in this push: the package comes from the workflow_run after their builds"
        fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"

    - name: Upstream release
      if: steps.gate.outputs.skip != '1'
      run: |
        mkdir -p "$RUNNER_TEMP/up" && cd "$RUNNER_TEMP/up"
        gh release list --repo luuumi-dev/nullarc -L 20 || true
        tag=$(gh release list --repo luuumi-dev/nullarc -L 1 --json tagName -q '.[0].tagName' || true)
        [ -n "$tag" ] || { echo "::error::luuumi-dev/nullarc has no releases (NVMTLDriver.bundle comes only from one)"; exit 1; }
        echo "upstream release $tag"
        gh release download "$tag" --repo luuumi-dev/nullarc --pattern 'nullarc-*.zip'
        ls -la
        ditto -x -k nullarc-*.zip .
        UP=$(ls -d "$RUNNER_TEMP"/up/nullarc-*/ | head -1)
        echo "UP=$UP" >> "$GITHUB_ENV"
        echo "upstream: $(basename "$UP")"
        test -d "$UP/PhxGPU/NVMTLDriver.bundle"

    - name: This repository's builds
      if: steps.gate.outputs.skip != '1'
      run: |
        for w in build-kexts.yml:kexts build-mesa.yml:mesa-radv; do
          # the newest green run by run id (ids only grow; the API's timestamps did not order them: Test G got old kexts)
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${w%%:*}" --branch main --status success -L 20 \
               --json databaseId -q 'map(.databaseId) | max')
          echo "${w##*:} from run $id"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "${w##*:}" --dir "$RUNNER_TEMP/${w##*:}"
        done
        cat "$RUNNER_TEMP/kexts/BUILD.txt" "$RUNNER_TEMP/mesa-radv/BUILD.txt"

    - name: Assemble
      if: steps.gate.outputs.skip != '1'
      run: |
        P="$RUNNER_TEMP/out/radearc-package"
        mkdir -p "$(dirname "$P")"
        ditto "$UP" "$P"
        K="$RUNNER_TEMP/kexts"; M="$RUNNER_TEMP/mesa-radv"
        rm -rf "$P/EFI/OC/Kexts/PhxBringup.kext" "$P/Library/Extensions/PhxAccel.kext"
        ditto "$K/PhxBringup.kext" "$P/EFI/OC/Kexts/PhxBringup.kext"
        ditto "$K/PhxAccel.kext" "$P/Library/Extensions/PhxAccel.kext"
        cp "$K"/phxctl/phxctl "$K"/phxctl/mesboot "$K"/phxctl/phxfw "$P/gpu/phxctl/"
        # Phase 3b Test J: the DMCUB loader, its test script and the 8500G's VBIOS (Phase 0 dump; DMUB window 3)
        cp "$K"/phxctl/dmcubload "$P/gpu/phxctl/" 2>/dev/null || echo "::warning::no dmcubload in the kext build yet"
        cp tools/phxctl/testj.sh "$P/"
        # Phase 3b Test K: the read-only mode check
        cp "$K"/phxctl/modecheck "$P/gpu/phxctl/" 2>/dev/null || echo "::warning::no modecheck in the kext build yet"
        cp tools/phxctl/testk.sh "$P/"
        # Phase 3b: the clocks and the SMU DPM table (DML inputs)
        cp "$K"/phxctl/clkinfo "$P/gpu/phxctl/" 2>/dev/null || echo "::warning::no clkinfo in the kext build yet"
        cp tools/phxctl/testclk.sh "$P/"
        # Phase 3b Test L: the read-only dry run (HUBP0/OTG0 against Linux's DML)
        cp "$K"/phxctl/testl "$P/gpu/phxctl/" 2>/dev/null || echo "::warning::no testl in the kext build yet"
        cp tools/phxctl/testl.sh "$P/"
        cp tools/phxctl/bocheck.sh "$P/"
        cp tools/phxctl/update.sh "$P/"
        mkdir -p "$P/gpu/fw" && cp hardware/dumps/b650m_8500g/vbios.rom "$P/gpu/fw/vbios_b650m_8500g.rom"
        # RADV with the Phoenix 2 table (0007); the upstream loader and manifest stay
        cp "$M/libvulkan_radeon.dylib" "$P/PhxGPU/nvmtl/libvulkan_radeon.dylib"
        # WindowServer loads only signed code (ad-hoc is enough)
        codesign --force --sign - "$P/PhxGPU/nvmtl/libvulkan_radeon.dylib"
        codesign --verify --strict "$P/PhxGPU/nvmtl/libvulkan_radeon.dylib"
        for f in phxboot.sh full.sh bringup5.sh kinst.sh local.phxboot.plist; do cp "tools/phxctl/$f" "$P/gpu/"; done
        cp install/install.sh install/uninstall.sh "$P/"
        cp docs/INSTALL.md docs/TEST_PHOENIX2.md "$P/"
        bash tools/fetch_test_firmware.sh "$P/gpu/fw"
        chmod 755 "$P"/install.sh "$P"/uninstall.sh "$P"/gpu/*.sh "$P"/gpu/phxctl/*
        {
          echo "RadeArc package ${GITHUB_SHA}"
          echo "upstream $(basename "$UP")"
          sed 's/^/kexts: /' "$K/BUILD.txt"; sed 's/^/mesa: /' "$M/BUILD.txt"
        } > "$P/RADEARC_BUILD.txt"
        cat "$P/RADEARC_BUILD.txt"
        # what install.sh --check needs must be there
        for f in EFI/OC/Kexts/PhxBringup.kext Library/Extensions/PhxAccel.kext PhxGPU/NVMTLDriver.bundle \
                 PhxGPU/nvmtl/libvulkan_radeon.dylib gpu/phxboot.sh gpu/full.sh gpu/bringup5.sh gpu/kinst.sh \
                 gpu/phxctl/phxctl gpu/phxctl/mesboot gpu/phxctl/phxfw gpu/local.phxboot.plist \
                 gpu/fw/gc_11_0_4_mes1.bin gpu/fw/psp_13_0_11_toc.bin; do
          test -e "$P/$f" || { echo "::error::missing $f"; exit 1; }
        done
        plutil -lint "$P/Library/Extensions/PhxAccel.kext/Contents/Info.plist"
        grep -q 0x15c81002 "$P/Library/Extensions/PhxAccel.kext/Contents/Info.plist" || { echo "::error::PhxAccel lacks 15C8"; exit 1; }

    - uses: actions/upload-artifact@v4
      if: steps.gate.outputs.skip != '1'
      with:
        name: radearc-package
        path: ${{ runner.temp }}/out/
        retention-days: 30

    # update.sh downloads from here: https://github.com/<repo>/releases/download/package-latest/radearc-package.zip
    # (a release, unlike an Actions artifact, downloads without a GitHub login)
    - name: Publish to the package-latest release
      if: steps.gate.outputs.skip != '1'
      run: |
        cd "$RUNNER_TEMP/out"
        ditto -c -k --keepParent radearc-package radearc-package.zip
        cp radearc-package/RADEARC_BUILD.txt .
        gh release view package-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create package-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Latest install package" \
            --notes "Rebuilt by CI after every kext/Mesa build. Install with tools/phxctl/update.sh."
        gh release upload package-latest radearc-package.zip RADEARC_BUILD.txt --clobber --repo "$GITHUB_REPOSITORY"
        gh release edit package-latest --repo "$GITHUB_REPOSITORY" --notes "$(cat RADEARC_BUILD.txt)"
