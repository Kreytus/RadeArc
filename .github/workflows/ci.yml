name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make

    - name: Fetch Phoenix firmware fixtures (linux-firmware)
      run: make fixtures

    - name: Build and run unit tests
      env:
        REQUIRE_FIXTURES: "1"
      shell: bash
      run: |
        set +e
        make test CXX=clang++ 2>&1 | tee test.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          # Surface the failing output as an annotation on the PR.
          msg=$(tail -n 25 test.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Unit tests failed::${msg}"
        fi
        exit "$status"

    - name: Linux DML (DCN 3.1.4) for the 8500G's HDMI modes
      shell: bash
      run: |
        CC=clang bash tools/dml/build.sh
        for m in "148500 1920 88 44 2200 1080 4 5 1125" "335770 1920 48 32 2080 1080 4 5 1121" \
                 "415580 1920 48 32 2080 1080 3 4 1110"; do
          ./build/dml/dml314_run $m | sed -n 10,20p
        done

    - name: Generated DCN 3.1.4 register table and DML plans are current
      shell: bash
      run: |
        bash tools/dml/fetch_regs.sh
        python3 tools/dml/gen_dcn314_regs.py
        bash tools/dml/gen_plans.sh
        git diff --exit-code -- src/amd/phx_dcn314_prog_regs.h src/amd/phx_dml314_plans.h
